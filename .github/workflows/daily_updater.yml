name: 10KoraStats Daily Auto-Pilot

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# إعطاء صلاحية الكتابة رسمياً للروبوت لحل الخطأ 128
permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Today's Predictions
        run: |
          python generate_matches.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today_matches.json
          git commit -m "Auto-update matches: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
